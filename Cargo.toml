[package]
name = "rustydisc"
version = "1.10.0"
edition = "2024"

[[bin]]
name = "rustydisc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
glob = "0.3"
lofty = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time", "fs", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
regex = "1"
libc = "0.2"
argon2 = { version = "0.5", features = ["std"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[features]
hardware_tests = []
